name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/conterraneo-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/conterraneo-backend/pom.xml

      - name: Build backend
        run: ./mvnw -B -DskipTests package

      - name: Run backend unit tests
        run: ./mvnw -B test

      - name: Run backend integration tests
        run: ./mvnw -B verify -DskipITs=false

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test:ci

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download SonarScanner CLI
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q sonar-scanner.zip
          echo "$PWD/sonar-scanner-6.2.1.4610-linux-x64/bin" >> "$GITHUB_PATH"

      - name: SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          sonar-scanner \
            -Dsonar.organization=israelamaro \
            -Dsonar.projectKey=israelamaro \
            -Dsonar.projectName="Conterraneo Representacoes" \
            -Dsonar.sources=backend/conterraneo-backend/src,frontend/src \
            -Dsonar.tests=backend/conterraneo-backend/src/test,frontend/src \
            -Dsonar.java.binaries=backend/conterraneo-backend/target/classes \
            -Dsonar.java.source=21 \
            -Dsonar.login="${SONAR_TOKEN}" \
            -Dsonar.host.url="${SONAR_HOST_URL}"
